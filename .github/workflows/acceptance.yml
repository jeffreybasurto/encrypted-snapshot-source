name: Acceptance

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install age
        run: |
          set +x
          sudo apt-get update
          sudo apt-get install -y age

      - name: Run acceptance harness
        run: |
          set +x
          bash scripts/acceptance.sh
