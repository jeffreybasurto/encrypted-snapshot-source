name: Publish snapshot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    uses: ./.github/workflows/publish-encrypted-snapshot.yml
    with:
      destination_repository: jeffreybasurto/encrypted-snapshot-public
      destination_branch: snapshot
      age_recipient: age1caqkqf5k0z4k0e0vvwnje6pxv40sw3hr9jcgecvae3ayadeyfp7sfra7kx
      public_ci_template: templates/public-ci.yml
    secrets:
      destination_deploy_key: ${{ secrets.DEST_DEPLOY_KEY }}
